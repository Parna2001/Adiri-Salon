# Publishes dashboard.html to GitHub Pages as the site's index page.
# Only that one file is deployed; customer data is never part of the site (it's loaded in the browser).
name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths: [dashboard.html, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site folder
        run: |
          mkdir _site
          cp dashboard.html _site/index.html
          cp dashboard.html _site/dashboard.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
