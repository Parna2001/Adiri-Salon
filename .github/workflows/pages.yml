# Publishes dashboard.html to GitHub Pages as the site's index page, plus dashboard_data.enc.json:
# the customer data encrypted with a password (see dashboard_data.py). Plain customer data is never deployed.
name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths: [dashboard.html, dashboard_data.enc.json, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site folder
        run: |
          mkdir _site
          cp dashboard.html _site/index.html
          cp dashboard.html _site/dashboard.html
          if [ -f dashboard_data.enc.json ]; then cp dashboard_data.enc.json _site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
